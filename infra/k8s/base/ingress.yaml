# One host, path-routed (ingress-nginx). Longest prefix wins:
#   /api/agent → web (its nginx adds the agent's service token and maps to the agent's /v1;
#                     ingress-nginx can't add that header without configuration snippets)
#   /api, /seed → api        / → web
#   /mcp, /.well-known/oauth-protected-resource → mcp (remote MCP server, todo17 D12)
# Agent run streams are SSE: no proxy buffering and hour-long read/send timeouts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studio
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 200m
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # The API's nginx auth_request endpoint (todo9) is internal: web's nginx answers 404.
          - path: /api/auth/verify
            pathType: Exact
            backend:
              service:
                name: web
                port:
                  name: http
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  name: http
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  name: http
          - path: /api/agent
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /seed
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
