# Non-secret settings for apps/agent (its keys are unprefixed: apps/agent/src/config.ts).
# agent-secrets holds INTERNAL_AGENT_SERVICE_TOKEN, AGENT_DATABASE_URL, the model keys and
# DAYTONA_API_KEY (infra/k8s/README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
data:
  APP_ENV: production
  AGENT_HOST: 0.0.0.0
  AGENT_PORT: "8100"
  AGENT_STORE: postgres
  # Schema migrations run in the agent-migrate Job (base/jobs), not at startup.
  AGENT_AUTO_MIGRATE: "false"
  AGENT_EVENT_BUS: redis
  AGENT_REDIS_URL: redis://redis:6379/1
  # The agent-sweeper CronJob (base/jobs) sweeps leaked sandboxes instead of every replica.
  SWEEPER_ENABLED: "false"
  AGENT_KERNEL_URL: http://api
  # The seed and environment APIs (/seed, /api/…): apps/api serves them under the same paths.
  AGENT_STUDIO_URL: http://api
  AGENT_DATA_DIR: /tmp/agent
  AGENT_SHUTDOWN_GRACE_S: "100"
  LOG_LEVEL: info
