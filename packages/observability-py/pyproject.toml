[project]
name = "studio-observability"
version = "0.1.0"
description = "Shared service conventions: JSON logs, request ids, W3C traceparent, optional OpenTelemetry (todo/done/todo3.md E.4)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# OpenTelemetry is only switched on by OTEL_TRACES_EXPORTER (console | otlp | gcp) or
# OTEL_EXPORTER_OTLP_ENDPOINT (todo/todo27.md D4). The api and worker images install this extra
# (`--extra otel`); the workspace dev group includes it, so a plain `uv sync` has it too.
otel = [
    "opentelemetry-sdk>=1.38",
    "opentelemetry-exporter-otlp-proto-http>=1.38",
    "opentelemetry-exporter-gcp-trace==1.15.0",
]

[dependency-groups]
dev = ["pytest>=9.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_observability"]

[tool.pytest.ini_options]
pythonpath = ["src"]
