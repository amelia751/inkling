# worker-gpu: the worker image on one NVIDIA L4, gVisor, Spot. GPU jobs are kernel jobs with
# retries (the kernel owns them, E2), so a Spot preemption costs a retry, not a result. For a
# class that mustn't be preempted, add a second Deployment without the gke-spot selector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-gpu
  labels:
    app.kubernetes.io/name: worker-gpu
    app.kubernetes.io/component: worker
spec:
  # replicas: managed by KEDA (scaledobject.yaml), down to zero when no GPU job waits.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-gpu
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-gpu
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      nodeSelector:
        cloud.google.com/compute-class: Accelerator
        cloud.google.com/gke-accelerator: nvidia-l4
        cloud.google.com/gke-spot: "true"
      # Spot nodes give a preempted pod about 25 s; the heartbeat lease (todo12 M0) re-queues
      # the job after that. Ordinary drains still get the worker's full grace.
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: studio-worker
          ports:
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: worker-config
            - configMapRef:
                name: worker-gpu-config
            - secretRef:
                name: worker-secrets
          # Autopilot requires both the GPU type (nodeSelector) and count; CPU and memory are
          # set explicitly so a pod doesn't take a whole node by default.
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 10Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 10Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
