# Deletes leaked/expired Daytona sandboxes every 15 min, instead of an in-process sweeper on
# every agent replica (agent-config SWEEPER_ENABLED=false). Runs apps/agent/scripts/sweep.ts
# as bundled by the agent's build (dist/scripts/sweep.js).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-sweeper
  labels:
    app.kubernetes.io/name: agent-sweeper
    app.kubernetes.io/component: maintenance
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: agent-sweeper
        spec:
          restartPolicy: Never
          serviceAccountName: agent
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sweep
              image: studio-agent
              command: ["node", "apps/agent/dist/scripts/sweep.js", "--stop", "--delete"]
              envFrom:
                - configMapRef:
                    name: agent-config
                - secretRef:
                    name: agent-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
