# Managed service endpoints for prod (placeholders: replace with the real hosts). Only
# non-secret parts live here; anything with a password goes in the app's Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  STUDIO_REDIS_URL: rediss://redis.internal.example.com:6380/0
  STUDIO_S3_ENDPOINT: https://s3.us-east-1.amazonaws.com
  STUDIO_S3_BUCKET: prod-assets
  STUDIO_S3_REGION: us-east-1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
data:
  STUDIO_AGENT_REDIS_URL: rediss://redis.internal.example.com:6380/1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
data:
  KEDA_REDIS_ADDRESS: redis.internal.example.com:6380
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: versioning-config
data:
  STUDIO_VERSIONING_OBJECT_ENDPOINT: ""
  STUDIO_VERSIONING_OBJECT_PATH_STYLE: "false"
  STUDIO_VERSIONING_OBJECT_BUCKET: prod-versioning-objects
  STUDIO_VERSIONING_MANIFEST_BUCKET: prod-versioning-manifests
  STUDIO_VERSIONING_REDIS_URL: rediss://redis.internal.example.com:6380/2
# Database URLs carry credentials, so they are in the Secrets; for reference the hosts are
#   pg.internal.example.com:5432  databases `studio` (api, versioning schema) and `agent`.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-config
data:
  STUDIO_MCP_REDIS_URL: rediss://redis.internal.example.com:6380/3
