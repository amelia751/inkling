[project]
name = "studio-plugin-sdk"
version = "0.1.0"
description = "Typed SDK for Python plugin workers: tool registration, scoped kernel clients, mask normalisation"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[dependency-groups]
dev = ["pytest>=9.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_plugin_sdk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
