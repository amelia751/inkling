# Non-secret settings for apps/mcp (apps/mcp/src/config.ts). No secrets: it holds no credentials
# of its own and forwards each caller's bearer token to the api, which verifies it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-config
data:
  STUDIO_ENV: production
  STUDIO_MCP_TRANSPORT: http
  STUDIO_MCP_HOST: 0.0.0.0
  STUDIO_MCP_PORT: "8300"
  STUDIO_API_URL: http://api
  STUDIO_MCP_STUDIO_URL: http://api
  # The OAuth resource (token audience) and where clients find its metadata: overlays set the host.
  STUDIO_MCP_PUBLIC_URL: http://localhost/mcp
  # WorkOS AuthKit domain (the authorization server); overlays/gke with components/workos.
  STUDIO_MCP_AUTH_SERVER: ""
  STUDIO_MCP_RATE_LIMIT_PER_MIN: "120"
  STUDIO_MCP_WRITE_QUOTA_PER_DAY: "5000"
  STUDIO_MCP_REDIS_URL: redis://redis:6379/3
