# Non-secret settings for apps/agent (its keys are unprefixed: apps/agent/src/config.ts).
# agent-secrets holds STUDIO_AGENT_TOKEN, STUDIO_AGENT_DATABASE_URL, the model keys and
# DAYTONA_API_KEY (infra/k8s/README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
data:
  STUDIO_ENV: production
  STUDIO_AGENT_HOST: 0.0.0.0
  STUDIO_AGENT_PORT: "8100"
  STUDIO_AGENT_STORE: postgres
  # Schema migrations run in the agent-migrate Job (base/jobs), not at startup.
  STUDIO_AGENT_AUTO_MIGRATE: "false"
  STUDIO_AGENT_EVENT_BUS: redis
  STUDIO_AGENT_REDIS_URL: redis://redis:6379/1
  # The agent-sweeper CronJob (base/jobs) sweeps leaked sandboxes instead of every replica.
  STUDIO_AGENT_SWEEPER_ENABLED: "false"
  STUDIO_API_URL: http://api
  # The seed and environment APIs (/seed, /api/…): apps/api serves them under the same paths.
  STUDIO_WEB_URL: http://api
  STUDIO_AGENT_DATA_DIR: /tmp/agent
  # Sign-in (todo22 D2): the agent verifies the person's access token on proxied calls. It
  # needs STUDIO_AGENT_WORKOS_CLIENT_ID, which each overlay sets (prod, staging, gke/ai values).
  STUDIO_AGENT_AUTH_MODE: workos
  STUDIO_AGENT_SHUTDOWN_GRACE_S: "100"
  STUDIO_LOG_LEVEL: info
