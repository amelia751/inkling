# pipeline: called only by api (its private API); reaches the api's service routes, versioning
# and Postgres (both of its databases). No Google APIs and no internet (from Milestone 3 the gke
# overlay's pipeline-connectors component adds restricted.googleapis.com for Pub/Sub).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pipeline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pipeline
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - port: 8095
  egress:
    - to:
        - ipBlock:
            cidr: 10.255.0.0/16 # managed data services (overlay patches this)
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: versioning
      ports:
        - port: 8090
