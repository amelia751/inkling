apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
spec:
  # replicas: managed by KEDA (scaledobject.yaml), down to zero when the queue is empty.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      # Let an in-flight plugin job finish; the kernel re-queues it after its lease otherwise.
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: worker
      containers:
        - name: worker
          image: studio-worker
          ports:
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: worker-config
            - secretRef:
                name: worker-secrets
          # WorkOS event sync (todo9 D6): the api's key and client id, under the api's names (the
          # worker reads them so). Not the cookie password. Optional: unset means no sync.
          env:
            - name: INKLING_API_WORKOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: workos-secrets
                  key: INKLING_API_WORKOS_API_KEY
                  optional: true
            - name: INKLING_API_WORKOS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: workos-secrets
                  key: INKLING_API_WORKOS_CLIENT_ID
                  optional: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
