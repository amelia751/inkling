# Local cluster (kind/k3d): one replica each, in-cluster deps, local image tags loaded with
# `kind load docker-image studio-<app>:dev`. See docs/running.md.
#   kubectl apply -k infra/k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: studio-dev
resources:
  - namespace.yaml
  - ../../base
  - ../../base/deps

images:
  - name: studio-web
    newTag: dev
  - name: studio-api
    newTag: dev
  - name: studio-agent
    newTag: dev
  - name: studio-worker
    newTag: dev
  - name: studio-versioning
    newTag: dev

# DEV-ONLY PLACEHOLDERS, NOT SECRETS. Every value below is a fixed local-cluster credential
# (`dev-only-…`) for the in-cluster deps. Staging/prod create `<app>-secrets` out of band
# (infra/k8s/README.md); nothing under infra/ may contain a `kind: Secret` with data.
# For real model/Daytona keys on a dev cluster, see docs/running.md (kubectl create secret …).
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: deps-secrets
    literals:
      - POSTGRES_USER=studio
      - POSTGRES_PASSWORD=dev-only-pg-password
      - S3_ACCESS_KEY=dev-only-s3-access
      - S3_SECRET_KEY=dev-only-s3-secret
  - name: web-secrets
    literals:
      - INTERNAL_AGENT_SERVICE_TOKEN=dev-only-agent-service-token
  - name: api-secrets
    literals:
      - INKLING_API_DATABASE_URL=postgresql+psycopg://studio:dev-only-pg-password@postgres:5432/studio
      - INKLING_API_SECRET_KEY=dev-only-api-secret-key-not-for-production-0000
      - INKLING_API_WORKER_TOKEN=dev-only-worker-token
      - AWS_ACCESS_KEY_ID=dev-only-s3-access
      - AWS_SECRET_ACCESS_KEY=dev-only-s3-secret
  - name: worker-secrets
    literals:
      - INKLING_API_WORKER_TOKEN=dev-only-worker-token
  - name: agent-secrets
    literals:
      - INTERNAL_AGENT_SERVICE_TOKEN=dev-only-agent-service-token
      - AGENT_DATABASE_URL=postgres://studio:dev-only-pg-password@postgres:5432/agent
  - name: versioning-secrets
    literals:
      - INKLING_VERSIONING_DATABASE_URL=postgres://versioning_app:dev-only-app-pw@postgres:5432/studio?sslmode=disable
      - INKLING_VERSIONING_MIGRATE_DATABASE_URL=postgres://versioning_owner:dev-only-owner-pw@postgres:5432/studio?sslmode=disable
      - INKLING_VERSIONING_S3_ACCESS_KEY_ID=dev-only-s3-access
      - INKLING_VERSIONING_S3_SECRET_ACCESS_KEY=dev-only-s3-secret
  - name: versioning-bootstrap-secrets
    literals:
      - INKLING_VERSIONING_ADMIN_DATABASE_URL=postgres://studio:dev-only-pg-password@postgres:5432/studio?sslmode=disable
      - INKLING_VERSIONING_OWNER_PASSWORD=dev-only-owner-pw
      - INKLING_VERSIONING_APP_PASSWORD=dev-only-app-pw

# The api → versioning JWT key pair (Secret `api-versioning-jwt`, ConfigMap `versioning-jwks`)
# isn't generated here, so no private key is ever committed: `pnpm k8s:dev-keys` creates both
# in the namespace (once; pods wait for them).

patches:
  # One replica each: drop the HPAs (Deployments without `replicas` then run one).
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: any
  - target:
      kind: Deployment
      name: versioning
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # Worker: at most two, still scaled from zero by KEDA.
  - target:
      kind: ScaledObject
      name: worker
    patch: |-
      - op: replace
        path: /spec/maxReplicaCount
        value: 2
  - target:
      kind: ConfigMap
      name: worker-config
    patch: |-
      - op: replace
        path: /data/KEDA_REDIS_ADDRESS
        value: redis.studio-dev.svc.cluster.local:6379
  # No model or Daytona key needed: scripted model, sandboxes off (both refused in production).
  - target:
      kind: ConfigMap
      name: agent-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: development
      - op: add
        path: /data/AGENT_MODEL
        value: scripted
      - op: add
        path: /data/AGENT_SANDBOX
        value: "off"
  # The dev Postgres has no DBA: bootstrap the versioning roles and schema first.
  - target:
      kind: Job
      name: versioning-migrate
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: bootstrap
            image: studio-versioning
            command: ["/app/bin/migrate", "bootstrap"]
            envFrom:
              - secretRef:
                  name: versioning-bootstrap-secrets
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
