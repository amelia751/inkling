# Data-only manifest (docs/plugins.md §5.2). The TS manifest in ui/manifest.ts stays the
# source of truth for trusted UI code; this file is what the registry, installer and agent read.
schemaVersion: inkling.plugins/v1
id: inkling.wsi
name: Tiled image pyramids
version: 1.1.0
description: "Deep-zoom image pyramids (DZI) with vector regions, magic wand, point counting and µm measurements."
publisher: first-party
license: Proprietary
compatibility:
  studio: ">=0.1.0 <1.0.0"
  pluginApi: "^1"
requires:
  inkling.overlay2d: "^1"
capabilities:
  - id: pyramid.view
    mediaTypes: [application/x-dzi, image/tiff]
  - id: pyramid.annotate
    mediaTypes: [application/x-dzi, image/tiff]
runtime:
  kind: browser-bundled
ui:
  module: ui/manifest.ts
permissions:
  required: []
  optional: []
