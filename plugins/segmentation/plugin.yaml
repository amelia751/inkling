# Reference python-worker plugin (docs/plugins.md §5.1, §12). One capability, several
# providers; output is always the provider-independent image.segment result, which the
# kernel normalises into canonical mask annotations.
schemaVersion: studio.plugins/v1
id: studio.segmentation
name: Segmentation
version: 1.0.0
description: "Segment objects in images from text, point or box prompts. Mock provider for CI; Meta SAM (hosted) and a self-hosted SAM endpoint as configurable providers."
publisher: first-party
license: Apache-2.0
compatibility:
  studio: ">=0.1.0 <1.0.0"
  pluginApi: "^1"
capabilities:
  # Request and result schemas are the kernel's image.segment contract
  # (schemas/capabilities/image.segment.*.json); a plugin can't redefine them.
  - id: image.segment
    tool: segment_objects
    mediaTypes: [image/png, image/jpeg, image/webp]
runtime:
  kind: python-worker
  entrypoint: studio_plugin_segmentation.tools:register
  maxExecutionSeconds: 180
  concurrency: 4
providers:
  - id: mock
    implements: [image.segment]
    hosting: mock
    features: { text: true, points: true, boxes: true, video: false }
  - id: meta.sam
    implements: [image.segment]
    hosting: hosted
    # Meta Model API, SAM 3.1 (providers/meta_sam.py has the sources; checked 2026-10-30).
    egress: [api.meta.ai]
    secrets: [META_MODEL_API_KEY]
    # One text concept *or* box/point prompts per request (Meta can't mix them).
    features: { text: true, points: true, boxes: true, video: false }
    pricing:
      unit: image
      usdPerUnit: 0.0025
      effectiveAt: "2026-10-30"
      sourceUrl: https://dev.meta.ai/docs/pricing-rate-limits
    modelLicense: "SAM License (Meta; not an OSI licence)"
    serviceTerms: "Meta Model API terms (dev.meta.ai)"
  - id: local.sam
    implements: [image.segment]
    hosting: self-hosted
    egress: [sam.internal]
    features: { text: false, points: true, boxes: true, video: false }
  # ---- Models added by configuration (todo25 W7) -------------------------------------------
  # Generic first-party adapters (providers/oip.py, replicate.py, hf.py) configured by data; no
  # model-specific code. The endpoint's host must be in `egress`. Non-commercial or
  # research-only weights can be selected only in orgs marked research (the api enforces it).
  # The endpoints below are examples: point them at your deployment (config `endpoints`).
  - id: oip.sam
    implements: [image.segment]
    hosting: self-hosted
    egress: [sam-oip.internal]
    features: { text: false, points: true, boxes: true, video: false }
    modelLicense: "SAM License (Meta; not an OSI licence)"
    adapter: { kind: oip, endpoint: "https://sam-oip.internal", model: sam-3.1, masks: rle }
  - id: replicate.yolo26-seg
    implements: [image.segment]
    hosting: hosted
    egress: [api.replicate.com, replicate.delivery]
    secrets: [REPLICATE_API_TOKEN]
    # Automatic instance segmentation of everyday objects: no prompts.
    features: { text: false, points: false, boxes: false, video: false }
    pricing:
      # Billed per second of GPU time (T4 rate); a 640px image takes about a second.
      unit: second
      usdPerUnit: 0.000225
      effectiveAt: "2026-11-04"
      sourceUrl: https://replicate.com/pricing
    modelLicense: "AGPL-3.0 (Ultralytics YOLO; or an Ultralytics Enterprise licence)"
    serviceTerms: "Replicate terms of service (replicate.com/terms)"
    adapter: { kind: replicate, endpoint: "https://api.replicate.com/v1/models/ultralytics/yolo26-seg/predictions", secret: REPLICATE_API_TOKEN, image: dataUrl, masks: png }
  - id: hf.medsam2
    implements: [image.segment]
    hosting: hosted
    egress: [medsam2.us-east-1.aws.endpoints.huggingface.cloud]
    secrets: [HF_TOKEN]
    features: { text: false, points: false, boxes: true, video: false }
    pricing:
      # A dedicated Inference Endpoint is billed per second it's up (1x T4).
      unit: second
      usdPerUnit: 0.000139
      effectiveAt: "2026-11-04"
      sourceUrl: https://huggingface.co/pricing
    modelLicense: "MedSAM2: research and education use only (non-commercial)"
    serviceTerms: "Hugging Face Inference Endpoints terms"
    adapter: { kind: hf, endpoint: "https://medsam2.us-east-1.aws.endpoints.huggingface.cloud", secret: HF_TOKEN, masks: png }
ui:
  contributions: ui/contributions.json
skills:
  - skills/segmentation/SKILL.md
permissions:
  required:
    - assets.read
    - annotations.write
    - jobs.create
  optional:
    - network.egress:api.meta.ai
    - secrets.use:META_MODEL_API_KEY
    - network.egress:sam.internal
    # todo25 W7 adapters
    - network.egress:sam-oip.internal
    - network.egress:api.replicate.com
    - network.egress:replicate.delivery
    - secrets.use:REPLICATE_API_TOKEN
    - network.egress:medsam2.us-east-1.aws.endpoints.huggingface.cloud
    - secrets.use:HF_TOKEN
resources:
  defaultBudgetUsdPerJob: 1.00
  maxBudgetUsdPerJob: 25.00
  maxImagesPerJob: 1000
events:
  subscribes: []
