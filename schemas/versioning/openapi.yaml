openapi: 3.0.3
info:
  title: Dataset versioning internal API
  version: 1.0.0
  description: |
    Internal API of apps/versioning (versioning.md §10). Only apps/api and
    apps/worker call it; browsers never do. Every /internal/v1 request carries a
    short-lived Ed25519 JWT minted by apps/api (todo4 V4). Write operations take
    an Idempotency-Key. Errors are application/problem+json with a stable `code`.
servers:
  - url: http://versioning:8090
security:
  - serviceJWT: []
tags:
  - name: repos
  - name: branches
  - name: artifacts
  - name: commits
  - name: diff
  - name: reviews
  - name: releases
  - name: checkouts
  - name: ops
paths:
  /healthz:
    get:
      tags: [ops]
      operationId: healthz
      security: []
      responses:
        "200": {description: Process is alive, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
  /readyz:
    get:
      tags: [ops]
      operationId: readyz
      security: []
      responses:
        "200": {description: Dependencies reachable, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
        "503": {description: A dependency is unreachable, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
  /version:
    get:
      tags: [ops]
      operationId: version
      security: []
      responses:
        "200": {description: Build info, content: {application/json: {schema: {$ref: "#/components/schemas/VersionInfo"}}}}

  /internal/v1/repos:
    post:
      tags: [repos]
      operationId: createRepo
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CreateRepoRequest"}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Repository"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/repos/{repo_id}:
    parameters: [{$ref: "#/components/parameters/RepoID"}]
    get:
      tags: [repos]
      operationId: getRepo
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Repository"}}}}
        default: {$ref: "#/components/responses/Problem"}

  /internal/v1/repos/{repo_id}/branches:
    parameters: [{$ref: "#/components/parameters/RepoID"}]
    post:
      tags: [branches]
      operationId: createBranch
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CreateBranchRequest"}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Branch"}}}}
        default: {$ref: "#/components/responses/Problem"}
    get:
      tags: [branches]
      operationId: listBranches
      parameters: [{$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BranchPage"}}}}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [branches]
      operationId: deleteBranch
      description: Tombstones the branch; it stays a GC root for the retention period. Refused on protected branches.
      parameters:
        - {name: name, in: query, required: true, schema: {$ref: "#/components/schemas/BranchName"}}
        - {name: expected_head, in: query, required: true, schema: {$ref: "#/components/schemas/CommitOID"}}
      responses:
        "200": {description: Tombstoned, content: {application/json: {schema: {$ref: "#/components/schemas/Branch"}}}}
        default: {$ref: "#/components/responses/Problem"}

  /internal/v1/artifacts/{sha256}:
    parameters: [{$ref: "#/components/parameters/SHA256"}]
    put:
      tags: [artifacts]
      operationId: putArtifact
      description: Streams raw bytes to staging. Hash and length are verified before the object becomes visible.
      parameters:
        - {name: X-Media-Type, in: header, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary}}}
      responses:
        "201": {description: Staged, content: {application/json: {schema: {$ref: "#/components/schemas/Artifact"}}}}
        "200": {description: Already present, content: {application/json: {schema: {$ref: "#/components/schemas/Artifact"}}}}
        default: {$ref: "#/components/responses/Problem"}
    get:
      tags: [artifacts]
      operationId: getArtifact
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Artifact"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/artifacts/{sha256}/purge:
    parameters: [{$ref: "#/components/parameters/SHA256"}]
    post:
      tags: [artifacts]
      operationId: purgeArtifact
      description: Deletes the bytes of a withdrawn artifact (todo4 V9). Disabled unless PURGE_ENABLED; blocked by legal holds and by any live branch head or release still referencing it.
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/PurgeRequest"}}}
      responses:
        "200": {description: Purged, content: {application/json: {schema: {$ref: "#/components/schemas/Artifact"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/annotation-revisions:
    post:
      tags: [artifacts]
      operationId: putAnnotationRevision
      description: Canonicalises, validates and stores an immutable annotation-revision document as an artifact.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AnnotationRevision"}}}
      responses:
        "201": {description: Stored, content: {application/json: {schema: {$ref: "#/components/schemas/ContentRef"}}}}
        default: {$ref: "#/components/responses/Problem"}

  /internal/v1/repos/{repo_id}/manifests:
    parameters: [{$ref: "#/components/parameters/RepoID"}]
    post:
      tags: [commits]
      operationId: putManifest
      description: Validates, canonicalises and stores a manifest; returns its root hash for a later commit.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/Manifest"}}}
      responses:
        "201": {description: Stored, content: {application/json: {schema: {$ref: "#/components/schemas/ManifestRoot"}}}}
        default: {$ref: "#/components/responses/Problem"}

  /internal/v1/repos/{repo_id}/commits:
    parameters: [{$ref: "#/components/parameters/RepoID"}]
    post:
      tags: [commits]
      operationId: createCommit
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CommitRequest"}}}
      responses:
        "201": {description: Committed, content: {application/json: {schema: {$ref: "#/components/schemas/CommitResult"}}}}
        default: {$ref: "#/components/responses/Problem"}
    get:
      tags: [commits]
      operationId: listCommits
      parameters:
        - {name: ref, in: query, required: true, schema: {type: string, maxLength: 128}, description: Branch name or commit oid}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CommitPage"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/repos/{repo_id}/commits/{commit_oid}:
    parameters: [{$ref: "#/components/parameters/RepoID"}, {name: commit_oid, in: path, required: true, schema: {$ref: "#/components/schemas/CommitOID"}}]
    get:
      tags: [commits]
      operationId: getCommit
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Commit"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/repos/{repo_id}/studio:
    parameters: [{$ref: "#/components/parameters/RepoID"}]
    get:
      tags: [commits]
      operationId: getStudio
      description: The Studio definition (`.studio/` files) at a branch, commit oid or release (todo10 §3.2).
      parameters:
        - {name: ref, in: query, required: true, schema: {type: string, maxLength: 128}, description: "Branch name, commit oid or tag:<release>"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Studio"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/repos/{repo_id}/reverts:
    parameters: [{$ref: "#/components/parameters/RepoID"}]
    post:
      tags: [commits]
      operationId: revert
      description: Creates a new commit whose manifest equals the target commit's manifest (spec §6).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RevertRequest"}}}
      responses:
        "201": {description: Committed, content: {application/json: {schema: {$ref: "#/components/schemas/CommitResult"}}}}
        default: {$ref: "#/components/responses/Problem"}

  /internal/v1/repos/{repo_id}/diff:
    parameters: [{$ref: "#/components/parameters/RepoID"}]
    get:
      tags: [diff]
      operationId: getDiff
      parameters:
        - {name: base, in: query, required: true, schema: {$ref: "#/components/schemas/CommitOID"}}
        - {name: head, in: query, required: true, schema: {$ref: "#/components/schemas/CommitOID"}}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: Diff page, content: {application/json: {schema: {$ref: "#/components/schemas/DiffPage"}}}}
        "202": {description: Large diff computed in the background, content: {application/json: {schema: {$ref: "#/components/schemas/DiffJob"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/repos/{repo_id}/diff-jobs/{job_id}:
    parameters: [{$ref: "#/components/parameters/RepoID"}, {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [diff]
      operationId: getDiffJob
      parameters: [{$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses:
        "200": {description: Finished, content: {application/json: {schema: {$ref: "#/components/schemas/DiffPage"}}}}
        "202": {description: Still running, content: {application/json: {schema: {$ref: "#/components/schemas/DiffJob"}}}}
        default: {$ref: "#/components/responses/Problem"}

  /internal/v1/repos/{repo_id}/reviews:
    parameters: [{$ref: "#/components/parameters/RepoID"}]
    post:
      tags: [reviews]
      operationId: createReview
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CreateReviewRequest"}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Review"}}}}
        default: {$ref: "#/components/responses/Problem"}
    get:
      tags: [reviews]
      operationId: listReviews
      parameters:
        - {name: status, in: query, schema: {$ref: "#/components/schemas/ReviewStatus"}}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ReviewPage"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/repos/{repo_id}/reviews/{review_id}:
    parameters: [{$ref: "#/components/parameters/RepoID"}, {$ref: "#/components/parameters/ReviewID"}]
    get:
      tags: [reviews]
      operationId: getReview
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Review"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/repos/{repo_id}/reviews/{review_id}/publish:
    parameters: [{$ref: "#/components/parameters/RepoID"}, {$ref: "#/components/parameters/ReviewID"}]
    post:
      tags: [reviews]
      operationId: publishReview
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Review"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/repos/{repo_id}/reviews/{review_id}/approve:
    parameters: [{$ref: "#/components/parameters/RepoID"}, {$ref: "#/components/parameters/ReviewID"}]
    post:
      tags: [reviews]
      operationId: approveReview
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ApproveRequest"}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Review"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/repos/{repo_id}/reviews/{review_id}/comments:
    parameters: [{$ref: "#/components/parameters/RepoID"}, {$ref: "#/components/parameters/ReviewID"}]
    post:
      tags: [reviews]
      operationId: addReviewComment
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CommentRequest"}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Comment"}}}}
        default: {$ref: "#/components/responses/Problem"}
    get:
      tags: [reviews]
      operationId: listReviewComments
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Comment"}}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/repos/{repo_id}/reviews/{review_id}/resolutions:
    parameters: [{$ref: "#/components/parameters/RepoID"}, {$ref: "#/components/parameters/ReviewID"}]
    post:
      tags: [reviews]
      operationId: resolveConflicts
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ResolutionsRequest"}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Review"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/repos/{repo_id}/reviews/{review_id}/checks/{check_name}:
    parameters:
      - {$ref: "#/components/parameters/RepoID"}
      - {$ref: "#/components/parameters/ReviewID"}
      - {name: check_name, in: path, required: true, schema: {type: string, pattern: "^[a-z][a-z0-9_]{0,63}$"}}
    post:
      tags: [reviews]
      operationId: reportCheck
      description: A worker reports an externally computed check (e.g. de-identification) for immutable OIDs.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CheckReport"}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Review"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/repos/{repo_id}/reviews/{review_id}/recheck:
    parameters: [{$ref: "#/components/parameters/RepoID"}, {$ref: "#/components/parameters/ReviewID"}]
    post:
      tags: [reviews]
      operationId: recheckReview
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Review"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/repos/{repo_id}/reviews/{review_id}/merge:
    parameters: [{$ref: "#/components/parameters/RepoID"}, {$ref: "#/components/parameters/ReviewID"}]
    post:
      tags: [reviews]
      operationId: mergeReview
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/MergeRequest"}}}
      responses:
        "200": {description: Merged, content: {application/json: {schema: {$ref: "#/components/schemas/Review"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/repos/{repo_id}/reviews/{review_id}/close:
    parameters: [{$ref: "#/components/parameters/RepoID"}, {$ref: "#/components/parameters/ReviewID"}]
    post:
      tags: [reviews]
      operationId: closeReview
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Review"}}}}
        default: {$ref: "#/components/responses/Problem"}

  /internal/v1/repos/{repo_id}/releases:
    parameters: [{$ref: "#/components/parameters/RepoID"}]
    post:
      tags: [releases]
      operationId: createRelease
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CreateReleaseRequest"}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Release"}}}}
        default: {$ref: "#/components/responses/Problem"}
    get:
      tags: [releases]
      operationId: listReleases
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Release"}}}}}
        default: {$ref: "#/components/responses/Problem"}
  /internal/v1/repos/{repo_id}/releases/{tag}:
    parameters: [{$ref: "#/components/parameters/RepoID"}, {name: tag, in: path, required: true, schema: {$ref: "#/components/schemas/Tag"}}]
    get:
      tags: [releases]
      operationId: getRelease
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Release"}}}}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [releases]
      operationId: deleteRelease
      responses:
        "204": {description: Deleted}
        default: {$ref: "#/components/responses/Problem"}

  /internal/v1/repos/{repo_id}/checkouts:
    parameters: [{$ref: "#/components/parameters/RepoID"}]
    post:
      tags: [checkouts]
      operationId: createCheckout
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CheckoutRequest"}}}
      responses:
        "200": {description: Manifest page with signed URLs, content: {application/json: {schema: {$ref: "#/components/schemas/Checkout"}}}}
        default: {$ref: "#/components/responses/Problem"}

  /internal/v1/repos/{repo_id}/legal-holds:
    parameters: [{$ref: "#/components/parameters/RepoID"}]
    post:
      tags: [artifacts]
      operationId: createLegalHold
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/LegalHoldRequest"}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/LegalHold"}}}}
        default: {$ref: "#/components/responses/Problem"}

components:
  securitySchemes:
    serviceJWT: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    RepoID: {name: repo_id, in: path, required: true, schema: {type: string, format: uuid}}
    ReviewID: {name: review_id, in: path, required: true, schema: {type: string, format: uuid}}
    SHA256: {name: sha256, in: path, required: true, schema: {$ref: "#/components/schemas/SHA256"}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 512}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
  responses:
    Problem:
      description: Error
      content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code:
          type: string
          description: Stable machine code.
          enum: [bad_request, unauthenticated, forbidden, not_found, conflict, stale_head, idempotency_mismatch,
                 multiple_merge_bases, protected_branch, purged, invalid_transition, self_approval, not_ready,
                 unresolved_conflicts, validation_failed, rate_limited, too_large, disabled, legal_hold,
                 retention, internal]
        detail: {type: string}
        request_id: {type: string}
        current_head: {type: string}
        head_generation: {type: integer, format: int64}
        problems: {type: array, items: {type: string}}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, degraded]}
        checks: {type: object, additionalProperties: {type: string}}
    VersionInfo:
      type: object
      required: [git_sha, git_library, schema_version]
      properties:
        git_sha: {type: string}
        git_library: {type: string}
        schema_version: {type: integer, format: int64}
    SHA256: {type: string, pattern: "^[0-9a-f]{64}$"}
    ContentHash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
    CommitOID: {type: string, pattern: "^[0-9a-f]{40}$"}
    BranchName: {type: string, pattern: "^[a-z0-9][a-z0-9._/-]{0,127}$"}
    Tag: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"}
    ActorKind: {type: string, enum: [user, agent, service]}
    CreateRepoRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        policy_id: {type: string, maxLength: 64}
        required_approvals: {type: integer, minimum: 0, maximum: 10}
    Repository:
      type: object
      required: [id, tenant_id, project_id, name, default_branch, policy_id, object_format, head, head_generation, created_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        name: {type: string}
        default_branch: {type: string}
        policy_id: {type: string}
        object_format: {type: string, enum: [sha1, sha256]}
        head: {$ref: "#/components/schemas/CommitOID"}
        head_generation: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
    CreateBranchRequest:
      type: object
      required: [name, from]
      properties:
        name: {$ref: "#/components/schemas/BranchName"}
        from: {type: string, maxLength: 128, description: Commit oid or existing branch name}
        protected: {type: boolean}
    Branch:
      type: object
      required: [name, commit_oid, generation, protected, updated_at]
      properties:
        name: {type: string}
        commit_oid: {$ref: "#/components/schemas/CommitOID"}
        generation: {type: integer, format: int64}
        protected: {type: boolean}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
    BranchPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Branch"}}
        next_cursor: {type: string}
    Artifact:
      type: object
      required: [sha256, size_bytes, media_type, status]
      properties:
        sha256: {$ref: "#/components/schemas/SHA256"}
        size_bytes: {type: integer, format: int64}
        media_type: {type: string}
        status: {type: string, enum: [staged, available, unreferenced, deleted, purged]}
        legal_hold: {type: boolean}
    PurgeRequest:
      type: object
      required: [reason_code]
      properties:
        reason_code: {type: string, pattern: "^[a-z][a-z0-9_]{0,63}$"}
    ContentRef:
      type: object
      required: [ref]
      properties:
        ref: {$ref: "#/components/schemas/ContentHash"}
    LegalHoldRequest:
      type: object
      required: [reason_code]
      properties:
        artifact_sha256: {$ref: "#/components/schemas/SHA256"}
        reason_code: {type: string, pattern: "^[a-z][a-z0-9_]{0,63}$"}
    LegalHold:
      type: object
      required: [id, reason_code, created_at]
      properties:
        id: {type: string, format: uuid}
        artifact_sha256: {type: string}
        reason_code: {type: string}
        created_at: {type: string, format: date-time}

    # ---- manifest documents (mirrors schemas/versioning/dataset-manifest.schema.json) ----
    Manifest:
      type: object
      additionalProperties: false
      required: [schema_version, ontology, samples, annotations]
      properties:
        schema_version: {type: string, enum: ["1"]}
        ontology: {$ref: "#/components/schemas/Ontology"}
        samples: {type: array, items: {$ref: "#/components/schemas/Sample"}}
        annotations: {type: array, items: {$ref: "#/components/schemas/ManifestAnnotation"}}
      x-go-type: manifests.Manifest
      x-go-type-import: {path: studio.local/versioning/internal/manifests}
    Ontology:
      x-go-type: manifests.Ontology
      x-go-type-import: {path: studio.local/versioning/internal/manifests}
