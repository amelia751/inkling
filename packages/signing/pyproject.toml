[project]
name = "studio-signing"
version = "0.1.0"
description = "Signer interface for plugin artifacts (todo10 Phase 3): local Ed25519 dev key, Cloud KMS"
requires-python = ">=3.12"
dependencies = ["cryptography>=50"]

[project.optional-dependencies]
# The Cloud KMS signer imports this lazily; images that sign with KMS install the extra.
gcpkms = ["google-cloud-kms>=3.2"]

[dependency-groups]
dev = ["pytest>=9.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_signing"]

[tool.pytest.ini_options]
pythonpath = ["src"]
