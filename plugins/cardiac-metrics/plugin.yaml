# Data-only manifest (docs/plugins.md §5.2). The TS manifest in ui/manifest.ts stays the
# source of truth for trusted UI code; this file is what the registry, installer and agent read.
schemaVersion: studio.plugins/v1
id: studio.cardiac-metrics
name: Cardiac function metrics
version: 1.0.0
description: "EDV, ESV, SV, EF, LV mass and Dice vs reference for a cardiac cine, as a panel and a CSV export."
publisher: first-party
license: Proprietary
compatibility:
  studio: ">=0.1.0 <1.0.0"
  pluginApi: "^1"
requires:
  studio.cine: "^1"
capabilities:
  - id: cine.metrics
    mediaTypes: [application/x-nifti]
runtime:
  kind: browser-bundled
ui:
  module: ui/manifest.ts
permissions:
  required: []
  optional: []
