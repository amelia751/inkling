# Non-secret settings for apps/api (keys carry the naming config's envPrefix). Endpoints
# here point at the in-cluster deps (overlays/dev); staging/prod patch in managed ones.
# Secrets (database URL with password, secret key, worker token, S3 keys) are in api-secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  INKLING_ENV: production
  INKLING_API_CREATE_TABLES: "0"
  # Sign-in (todo9 D8): `dev` trusts the dev identity headers; `workos` signs people in with
  # WorkOS AuthKit and requires DEV_TRUST_HEADERS=0 (overlays/prod; gke/phi components/workos).
  # The WorkOS key, cookie password and client id come from Secret workos-secrets (optional).
  INKLING_API_AUTH_MODE: dev
  INKLING_API_DEV_TRUST_HEADERS: "1"
  INKLING_REDIS_URL: redis://redis:6379/0
  INKLING_JOB_QUEUE: redis
  INKLING_EVENT_BUS: redis
  INKLING_BLOB_STORE: s3
  INKLING_S3_ENDPOINT: http://s3:9000
  INKLING_S3_BUCKET: assets
  INKLING_S3_REGION: us-east-1
  INKLING_REPO_ROOT: /app
  # Dataset versioning: the api signs a 60 s JWT per call with the key in `api-versioning-jwt`;
  # the service verifies with the matching public key in the `versioning-jwks` ConfigMap.
  INKLING_API_VERSIONING_URL: http://versioning:8090
  INKLING_API_VERSIONING_JWT_KEY_FILE: /etc/api/versioning/jwt.key
  INKLING_API_VERSIONING_JWKS_FILE: /tmp/versioning-jwks.json
  INKLING_API_VERSIONING_JWT_KID: api
  # The pipeline's private API (apps/pipeline): the api signs each call with the same key and kid
  # (audience `pipeline`); the pipeline verifies against ConfigMap api-jwks. The token the
  # pipeline presents to the api's service routes is <envPrefix>API_PIPELINE_TOKEN in api-secrets.
  INKLING_API_PIPELINE_URL: http://pipeline:8095
  INKLING_API_PIPELINE_JWT_KID: api
  # Drops (todo13 §7.1): per drop, at most this many files and bytes (50 GB); above it the card
  # points to Files' folder upload. 20 drops a minute per person (429 with a retry hint).
  INKLING_API_DROP_MAX_FILES: "10000"
  INKLING_API_DROP_MAX_BYTES: "53687091200"
  INKLING_API_DROP_RATE_PER_MINUTE: "20"
  # How long an automatically applied drop plan can be undone (D6).
  INKLING_API_DROP_UNDO_SECONDS: "30"
  # Name screening (D3, D13): Sensitive Data Protection in the api's own project (the phi
  # overlay names it); `regex` only in dev and tests, never `off` in production (refused).
  # BATCH names per call; QPS calls per second per pod, shared by live drops and the backfill.
  INKLING_API_NAME_SCREEN_MODE: dlp
  INKLING_API_NAME_SCREEN_BATCH: "500"
  INKLING_API_NAME_SCREEN_QPS: "5"
  INKLING_API_NAME_SCREEN_LOCATION: us-central1
  # Feature flags (served at GET /api/v1/features; a flag off hides its UI and 404s its routes).
  # Off in production until the rollout (docs/deployment-gcp.md, "Rolling out drops"):
  # CHAT_DROPS, then DATASETS_TAB, then FAST_PATH, then AUTO_APPLY, a day apart.
  INKLING_API_FEATURE_CHAT_DROPS: "false"
  INKLING_API_FEATURE_DATASETS_TAB: "false"
  INKLING_API_FEATURE_FAST_PATH: "false"
  INKLING_API_FEATURE_AUTO_APPLY: "false"
