# Non-secret settings for apps/versioning (keys: <envPrefix>VERSIONING_*). versioning-secrets
# holds the database URL (versioning_app role) and the S3 keys; the JWKS (public keys of
# apps/api's service-JWT signer) is the versioning-jwks ConfigMap, created per stage.
apiVersion: v1
kind: ConfigMap
metadata:
  name: versioning-config
data:
  STUDIO_VERSIONING_HTTP_ADDR: ":8090"
  STUDIO_VERSIONING_OBJECT_ENDPOINT: http://s3:9000
  STUDIO_VERSIONING_OBJECT_REGION: us-east-1
  STUDIO_VERSIONING_OBJECT_PATH_STYLE: "true"
  STUDIO_VERSIONING_JWT_PUBLIC_KEY_FILE: /etc/versioning/jwks/jwks.json
  STUDIO_VERSIONING_JWT_AUDIENCE: versioning
  STUDIO_VERSIONING_JWT_ISSUER: api
  STUDIO_VERSIONING_EVENT_BUS: redis
  STUDIO_VERSIONING_REDIS_URL: redis://redis:6379/2
  STUDIO_VERSIONING_GC_SWEEP_ENABLED: "false"
  STUDIO_VERSIONING_PURGE_ENABLED: "false"
  STUDIO_VERSIONING_TEMP_DIR: /tmp
