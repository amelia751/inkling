# Copies ConfigMap gke-values (local.env.example, or ../../live/ai/local.env for a real render)
# into the fields that need it. A Component so both entry points run the same replacements.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
replacements:
  - source: { kind: ConfigMap, name: gke-values, fieldPath: data.DATA_SERVICES_CIDR }
    targets:
      - select: { kind: NetworkPolicy, name: agent }
        fieldPaths: [spec.egress.0.to.0.ipBlock.cidr]
      - select: { kind: NetworkPolicy, name: agent-jobs }
        fieldPaths: [spec.egress.0.to.0.ipBlock.cidr]
  - source: { kind: ConfigMap, name: gke-values, fieldPath: data.CONTROL_PLANE_CIDR }
    targets:
      - select: { kind: NetworkPolicy, name: agent }
        fieldPaths: [spec.egress.1.to.0.ipBlock.cidr]
  - source: { kind: ConfigMap, name: gke-values, fieldPath: data.PHI_EGRESS_CIDR }
    targets:
      - select: { kind: Ingress, name: agent }
        fieldPaths: [metadata.annotations.nginx\.ingress\.kubernetes\.io/whitelist-source-range]
  - source: { kind: ConfigMap, name: gke-values, fieldPath: data.REDIS_HOST }
    targets:
      - select: { kind: ConfigMap, name: agent-config }
        fieldPaths: [data.STUDIO_AGENT_REDIS_URL]
        options: { delimiter: /, index: 2 }
  - source: { kind: ConfigMap, name: gke-values, fieldPath: data.AGENT_SERVICE_ACCOUNT }
    targets:
      - select: { kind: ServiceAccount, name: agent }
        fieldPaths: [metadata.annotations.iam\.gke\.io/gcp-service-account]
  - source: { kind: ConfigMap, name: gke-values, fieldPath: data.AGENT_HOST }
    targets:
      - select: { kind: Ingress, name: agent }
        fieldPaths: [spec.rules.0.host, spec.tls.0.hosts.0]
  - source: { kind: ConfigMap, name: gke-values, fieldPath: data.AGENT_API_URL }
    targets:
      - select: { kind: ConfigMap, name: agent-config }
        fieldPaths: [data.STUDIO_API_URL, data.STUDIO_WEB_URL]
  - source: { kind: ConfigMap, name: gke-values, fieldPath: data.AGENT_WORKOS_CLIENT_ID }
    targets:
      - select: { kind: ConfigMap, name: agent-config }
        fieldPaths: [data.STUDIO_AGENT_WORKOS_CLIENT_ID]
