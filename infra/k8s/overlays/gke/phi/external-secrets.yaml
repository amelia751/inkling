# Every `<app>-secrets` comes from Secret Manager in this project (infra/terraform/phi/secrets.tf:
# one JSON object per secret), synced by the External Secrets Operator. ESO runs in namespace
# external-secrets as service account external-secrets, bound by Workload Identity to
# external-secrets@spurby-phi (secretAccessor on these secrets only). Nothing secret is committed.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secret-manager
spec:
  provider:
    gcpsm:
      projectID: spurby-phi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secret-manager
  target:
    name: web-secrets
  dataFrom:
    - extract:
        key: web-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secret-manager
  target:
    name: api-secrets
  dataFrom:
    - extract:
        key: api-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worker-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secret-manager
  target:
    name: worker-secrets
  dataFrom:
    - extract:
        key: worker-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: versioning-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secret-manager
  target:
    name: versioning-secrets
  dataFrom:
    - extract:
        key: versioning-secrets
---
# The api's Ed25519 key for versioning JWTs: {"jwt.key": "<PKCS8 PEM>"}.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-versioning-jwt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secret-manager
  target:
    name: api-versioning-jwt
  dataFrom:
    - extract:
        key: api-versioning-jwt
---
# apps/pipeline (Milestone 1): database URLs (role pipeline_app) and its api service token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pipeline-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secret-manager
  target:
    name: pipeline-secrets
  dataFrom:
    - extract:
        key: pipeline-secrets
---
# The pipeline's Ed25519 key for versioning JWTs (kid `pipeline`): {"jwt.key": "<PKCS8 PEM>"}.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pipeline-versioning-jwt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secret-manager
  target:
    name: pipeline-versioning-jwt
  dataFrom:
    - extract:
        key: pipeline-versioning-jwt
---
# db-bootstrap's inputs (admin DSN, role passwords), needed only while bootstrapping. Afterwards
# destroy the secret's version (gcloud secrets versions destroy) and delete the synced Secret;
# deletionPolicy Delete keeps it from being recreated once the source is gone.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-bootstrap-secrets
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: SecretStore
    name: secret-manager
  target:
    name: db-bootstrap-secrets
    deletionPolicy: Delete
  dataFrom:
    - extract:
        key: db-bootstrap-secrets
---
# Sign-in with WorkOS (todo9): {"INKLING_API_WORKOS_API_KEY": "sk_…", "INKLING_API_WORKOS_COOKIE_PASSWORD":
# "<Fernet key>", "INKLING_API_WORKOS_CLIENT_ID": "client_…"}. api reads all three, the worker
# the key and client id (base Deployments, optional refs). Unused until components/workos is on;
# until the secret has a version this ExternalSecret reports SecretSyncedError, which is harmless.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workos-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secret-manager
  target:
    name: workos-secrets
  dataFrom:
    - extract:
        key: workos-secrets
