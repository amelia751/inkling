# KEDA: scale the worker on the kernel's Redis ready list (apps/api JOB_QUEUE=redis). One replica
# per `listLength` queued jobs, up to maxReplicaCount. Never below one: besides jobs, the worker
# runs the event subscriptions (file inspection, archive unpack, item probes) and the scheduled
# tasks (name screening, housekeeping), none of which put anything on these lists, so at zero an
# upload would stay "checking" forever. (The GPU worker only runs jobs and still scales to zero.)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 10
  # Wait this long after the list empties before scaling to zero.
  cooldownPeriod: 300
  triggers:
    - type: redis
      metadata:
        addressFromEnv: KEDA_REDIS_ADDRESS
        databaseIndex: "0"
        listName: studio:jobs:ready
        listLength: "5"
        activationListLength: "0"
    # Memory-class jobs (WORKER_RESOURCE_CLASSES=cpu,memory) have their own ready list.
    - type: redis
      metadata:
        addressFromEnv: KEDA_REDIS_ADDRESS
        databaseIndex: "0"
        listName: studio:jobs:ready:memory
        listLength: "5"
        activationListLength: "0"
