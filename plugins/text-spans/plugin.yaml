# Data-only manifest (docs/plugins.md §5.2). The TS manifest in ui/manifest.ts stays the
# source of truth for trusted UI code; this file is what the registry, installer and agent read.
schemaVersion: studio.plugins/v1
id: studio.text-spans
name: Text spans
version: 0.1.0
description: "Plain-text documents with character-offset span labels; JSONL export in the spaCy / doccano shape."
publisher: first-party
license: Proprietary
compatibility:
  studio: ">=0.1.0 <1.0.0"
  pluginApi: "^1"
capabilities:
  - id: text.annotate
    mediaTypes: [text/plain, text/markdown]
runtime:
  kind: browser-bundled
ui:
  module: ui/manifest.ts
permissions:
  required: []
  optional: []
