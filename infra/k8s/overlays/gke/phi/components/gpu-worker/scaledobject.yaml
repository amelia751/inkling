# KEDA on the kernel's GPU ready list, from zero. The list name is the kernel's (todo12 M0,
# resource classes); maxReplicaCount stays within the granted L4 quota.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-gpu
spec:
  scaleTargetRef:
    name: worker-gpu
  minReplicaCount: 0
  maxReplicaCount: 4
  pollingInterval: 10
  cooldownPeriod: 300
  triggers:
    - type: redis
      metadata:
        addressFromEnv: KEDA_REDIS_ADDRESS
        databaseIndex: "0"
        listName: studio:jobs:ready:gpu
        listLength: "1"
        activationListLength: "0"
        enableTLS: "true"
      authenticationRef:
        name: worker-queue-redis
