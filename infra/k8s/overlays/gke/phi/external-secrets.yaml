# Every `<app>-secrets` comes from Secret Manager in this project (infra/terraform/phi/secrets.tf:
# one JSON object per secret), synced by the External Secrets Operator. ESO runs in namespace
# external-secrets as service account external-secrets, bound by Workload Identity to
# external-secrets@spurby-phi (secretAccessor on these secrets only). Nothing secret is committed.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secret-manager
spec:
  provider:
    gcpsm:
      projectID: spurby-phi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secret-manager
  target:
    name: web-secrets
  dataFrom:
    - extract:
        key: web-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secret-manager
  target:
    name: api-secrets
  dataFrom:
    - extract:
        key: api-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worker-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secret-manager
  target:
    name: worker-secrets
  dataFrom:
    - extract:
        key: worker-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: versioning-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secret-manager
  target:
    name: versioning-secrets
  dataFrom:
    - extract:
        key: versioning-secrets
---
# The api's Ed25519 key for versioning JWTs: {"jwt.key": "<PKCS8 PEM>"}.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-versioning-jwt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secret-manager
  target:
    name: api-versioning-jwt
  dataFrom:
    - extract:
        key: api-versioning-jwt
