# Non-secret settings for web. `config.json` is what the SPA fetches at startup (mounted at
# /etc/studio/config.json). The nginx template's env (INKLING_AGENT_URL) is set in the
# Deployment; the agent bearer token comes from web-secrets (INKLING_AGENT_TOKEN).
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
data:
  config.json: |
    {
      "apiBase": "/api",
      "agentBase": "/api/agent",
      "kernel": true,
      "flags": []
    }
