# The agent's Postgres schema (idempotent, advisory-locked), before each deploy: Argo CD
# PreSync hook, or re-run on the next `kubectl apply -k` once the finished Job is collected.
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-migrate
  labels:
    app.kubernetes.io/name: agent-migrate
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: studio-agent
          command: ["node", "apps/agent/dist/scripts/migrate.js"]
          envFrom:
            - configMapRef:
                name: agent-config
            - secretRef:
                name: agent-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
