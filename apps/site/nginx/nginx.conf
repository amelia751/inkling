# nginx for the site image (same as apps/web/nginx/nginx.conf: read-only root, temp paths in /tmp).
# file, temp paths and the rendered server config (from /etc/nginx/templates) live in /tmp.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  types {
    application/wasm wasm;
    application/javascript mjs;
  }
  default_type application/octet-stream;

  client_body_temp_path /tmp/nginx/client_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;

  # JSON access logs on stdout; probes are not logged (location-level access_log off).
  log_format json escape=json '{"time":"$time_iso8601","service":"site","request_id":"$request_id",'
                              '"method":"$request_method","uri":"$uri","status":$status,'
                              '"bytes":$body_bytes_sent,"duration_s":$request_time,'
                              '"upstream_s":"$upstream_response_time","ua":"$http_user_agent"}';
  access_log /dev/stdout json;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain application/xml;

  include /tmp/nginx/conf.d/*.conf;
}
