# agent-secrets from Secret Manager in spurby-ai (infra/terraform/ai/agent.tf), synced by the
# External Secrets Operator (namespace external-secrets, Workload Identity to
# external-secrets@spurby-ai).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secret-manager
spec:
  provider:
    gcpsm:
      projectID: spurby-ai
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: secret-manager
  target:
    name: agent-secrets
  dataFrom:
    - extract:
        key: agent-secrets
