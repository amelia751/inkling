apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandboxes
spec:
  hard:
    pods: "40"
    requests.cpu: "40"
    requests.memory: 80Gi
    limits.cpu: "80"
    limits.memory: 160Gi
    services: "0"
    secrets: "0"
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandboxes
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: "1"
        memory: 2Gi
      max:
        cpu: "4"
        memory: 8Gi
