# Build-time only (not applied): values for `replacements` in kustomization.yaml, from
# `terraform output` (placeholders until the stacks are applied).
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-config
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  # infra/terraform/phi: data_services_cidr (Cloud SQL and Memorystore, private services access).
  DATA_SERVICES_CIDR: 10.30.0.0/16
  # infra/terraform/ai: nat_egress_ip/32 (every request from the agent cluster).
  AGENT_EGRESS_CIDR: 203.0.113.10/32
  # infra/terraform/ai: ingress_ip/32 (the agent's public ingress; web's only egress).
  AGENT_INGRESS_CIDR: 203.0.113.11/32
