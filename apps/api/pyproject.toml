[project]
name = "studio-api"
version = "0.1.0"
description = "Studio kernel and plugin control plane (docs/plugins.md §6, §7, §11)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.54",
    "pydantic>=2.14",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "cryptography>=50",
    "pyyaml>=6.0",
    "httpx>=0.28",
    # The generated versioning client (src/studio_api/clients/versioning) needs these.
    "attrs>=24.2",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "datamodel-code-generator==0.87.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
