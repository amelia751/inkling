# Reference python-worker plugin (docs/plugins.md §5.1, §12). One capability, several
# providers; output is always the provider-independent image.segment result, which the
# kernel normalises into canonical mask annotations.
schemaVersion: inkling.plugins/v1
id: inkling.segmentation
name: Segmentation
version: 1.0.0
description: "Segment objects in images from text, point or box prompts. Mock provider for CI; Meta SAM (hosted) and a self-hosted SAM endpoint as configurable providers."
publisher: first-party
license: Apache-2.0
compatibility:
  studio: ">=0.1.0 <1.0.0"
  pluginApi: "^1"
capabilities:
  # Request and result schemas are the kernel's image.segment contract
  # (schemas/capabilities/image.segment.*.json); a plugin can't redefine them.
  - id: image.segment
    tool: segment_objects
    mediaTypes: [image/png, image/jpeg, image/webp]
runtime:
  kind: python-worker
  entrypoint: segmentation_plugin.tools:register
  maxExecutionSeconds: 180
  concurrency: 4
providers:
  - id: mock
    implements: [image.segment]
    hosting: mock
    features: { text: true, points: true, boxes: true, video: false }
  - id: meta.sam
    implements: [image.segment]
    hosting: hosted
    # Meta Model API, SAM 3.1 (providers/meta_sam.py has the sources; checked 2026-10-30).
    egress: [api.meta.ai]
    secrets: [META_MODEL_API_KEY]
    # One text concept *or* box/point prompts per request (Meta can't mix them).
    features: { text: true, points: true, boxes: true, video: false }
    pricing:
      unit: image
      usdPerUnit: 0.0025
      effectiveAt: "2026-10-30"
      sourceUrl: https://dev.meta.ai/docs/pricing-rate-limits
    modelLicense: "SAM License (Meta; not an OSI licence)"
    serviceTerms: "Meta Model API terms (dev.meta.ai)"
  - id: local.sam
    implements: [image.segment]
    hosting: self-hosted
    egress: [sam.internal]
    features: { text: false, points: true, boxes: true, video: false }
ui:
  contributions: ui/contributions.json
skills:
  - skills/segmentation/SKILL.md
permissions:
  required:
    - assets.read
    - annotations.write
    - jobs.create
  optional:
    - network.egress:api.meta.ai
    - secrets.use:META_MODEL_API_KEY
    - network.egress:sam.internal
resources:
  defaultBudgetUsdPerJob: 1.00
  maxBudgetUsdPerJob: 25.00
  maxImagesPerJob: 1000
events:
  subscribes: []
