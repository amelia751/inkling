# The agent in spurby-ai. Endpoints are placeholders from `terraform output` (infra/terraform/ai
# and phi). Secrets (token, database URL, Redis AUTH URL, DAYTONA_API_KEY during the trial) are
# in agent-secrets; with D8 there is no model key at all.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
data:
  # D8: the model on Vertex AI in this project, with Workload Identity (studio-agent has
  # roles/aiplatform.user). Only Vertex models are allowed, so no prompt leaves Google.
  INKLING_AGENT_MODEL: google-vertex:gemini-3.1-pro-preview
  INKLING_AGENT_MODEL_ALLOWLIST: google-vertex:gemini-3.1-pro-preview,google-vertex:gemini-3.5-flash
  GOOGLE_CLOUD_PROJECT: spurby-ai
  GOOGLE_CLOUD_LOCATION: us-central1
  # spurby-phi's agent-only host (overlays/gke/phi/agent-api-ingress.yaml).
  INKLING_API_URL: https://agent-api.example.com
  INKLING_WEB_URL: https://agent-api.example.com
  # Memorystore (output redis_host); the URL with the AUTH string is in agent-secrets.
  INKLING_AGENT_REDIS_URL: rediss://10.60.0.3:6378/1
  # D9 trial: Daytona stays the provider until the GKE Sandbox provider (todo10-boundary's
  # SandboxProvider) lands; then `gke` with the settings in ../README.md.
  INKLING_AGENT_SANDBOX: daytona
