# Data-only manifest (docs/plugins.md §5.2). The TS manifest in ui/manifest.ts stays the
# source of truth for trusted UI code; this file is what the registry, installer and agent read.
schemaVersion: studio.plugins/v1
id: studio.table
name: Table
version: 0.1.0
description: "Tabular files (CSV, Parquet, Arrow) on a row grid: label rows or cells, flag rows labelled differently, export CSV with labels joined."
publisher: first-party
license: Proprietary
compatibility:
  studio: ">=0.1.0 <1.0.0"
  pluginApi: "^1"
capabilities:
  - id: table.annotate
    mediaTypes: [text/csv, application/vnd.apache.parquet, application/vnd.apache.arrow.file]
runtime:
  kind: browser-bundled
ui:
  module: ui/manifest.ts
permissions:
  required: []
  optional: []
