packages:
  - "apps/*"
  - "packages/*"
  # A plugin's package.json sits at the plugin root (its UI lives in ui/, exported as ./ui/*).
  - "plugins/*"
allowBuilds:
  "@google/genai": false
  esbuild: true
  core-js: false
  core-js-pure: false
  protobufjs: false
minimumReleaseAgeExclude:
  - "@daytona/analytics-api-client@0.227.0"
  - "@daytona/api-client@0.227.0"
  - "@daytona/sdk@0.227.0"
  - "@daytona/toolbox-api-client@0.227.0"
