# No Workload Identity annotation: the pipeline has no Google identity until Milestone 3
# (overlays/gke/phi/components/pipeline-connectors adds it). Everything Google it needs before
# then (blobs, signing) goes through the api.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  labels:
    app.kubernetes.io/name: pipeline
automountServiceAccountToken: false
