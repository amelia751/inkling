# Local cluster (kind/k3d): one replica each, in-cluster deps, local image tags loaded with
# `kind load docker-image studio-<app>:dev`. See README.md.
#   kubectl apply -k infra/k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: studio-dev
resources:
  - namespace.yaml
  - ../../base
  - ../../base/deps

images:
  - name: studio-web
    newTag: dev
  - name: studio-api
    newTag: dev
  - name: studio-agent
    newTag: dev
  - name: studio-mcp
    newTag: dev
  - name: studio-worker
    newTag: dev
  - name: studio-versioning
    newTag: dev
  - name: studio-pipeline
    newTag: dev

# DEV-ONLY PLACEHOLDERS, NOT SECRETS. Every value below is a fixed local-cluster credential
# (`dev-only-…`) for the in-cluster deps. Staging/prod create `<app>-secrets` out of band
# (infra/k8s/README.md); nothing under infra/ may contain a `kind: Secret` with data.
# For real model/Daytona keys on a dev cluster, see README.md (kubectl create secret …).
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: deps-secrets
    literals:
      - POSTGRES_USER=studio
      - POSTGRES_PASSWORD=dev-only-pg-password
      - S3_ACCESS_KEY=dev-only-s3-access
      - S3_SECRET_KEY=dev-only-s3-secret
  - name: web-secrets
    literals:
      - STUDIO_AGENT_TOKEN=dev-only-agent-service-token
  - name: api-secrets
    literals:
      - STUDIO_API_DATABASE_URL=postgresql+psycopg://studio:dev-only-pg-password@postgres:5432/studio
      - STUDIO_API_SECRET_KEY=dev-only-api-secret-key-not-for-production-0000
      - STUDIO_API_WORKER_TOKEN=dev-only-worker-token
      - STUDIO_API_PIPELINE_TOKEN=dev-only-pipeline-token
      - STUDIO_API_AGENT_SERVICE_TOKEN=dev-only-agent-service-token
      - STUDIO_API_APPROVAL_SECRET=dev-only-approval-secret
      - AWS_ACCESS_KEY_ID=dev-only-s3-access
      - AWS_SECRET_ACCESS_KEY=dev-only-s3-secret
  - name: worker-secrets
    literals:
      - STUDIO_API_WORKER_TOKEN=dev-only-worker-token
  - name: agent-secrets
    literals:
      - STUDIO_AGENT_TOKEN=dev-only-agent-service-token
      - STUDIO_AGENT_DATABASE_URL=postgres://studio:dev-only-pg-password@postgres:5432/agent
      - STUDIO_AGENT_APPROVAL_SECRET=dev-only-approval-secret
  - name: versioning-secrets
    literals:
      - STUDIO_VERSIONING_DATABASE_URL=postgres://versioning_app:dev-only-app-pw@postgres:5432/studio?sslmode=disable
      - STUDIO_VERSIONING_MIGRATE_DATABASE_URL=postgres://versioning_owner:dev-only-owner-pw@postgres:5432/studio?sslmode=disable
      - STUDIO_VERSIONING_S3_ACCESS_KEY_ID=dev-only-s3-access
      - STUDIO_VERSIONING_S3_SECRET_ACCESS_KEY=dev-only-s3-secret
  - name: versioning-bootstrap-secrets
    literals:
      - STUDIO_VERSIONING_ADMIN_DATABASE_URL=postgres://studio:dev-only-pg-password@postgres:5432/studio?sslmode=disable
      - STUDIO_VERSIONING_OWNER_PASSWORD=dev-only-owner-pw
      - STUDIO_VERSIONING_APP_PASSWORD=dev-only-app-pw
  - name: pipeline-secrets
    literals:
      - STUDIO_PIPELINE_DATABASE_URL=postgres://pipeline_app:dev-only-pipeline-pw@postgres:5432/studio?sslmode=disable&search_path=pipeline
      - STUDIO_PIPELINE_ENGINE_DATABASE_URL=postgres://pipeline_app:dev-only-pipeline-pw@postgres:5432/pipeline_engine?sslmode=disable
      - STUDIO_PIPELINE_API_TOKEN=dev-only-pipeline-token
  # Read by the db-bootstrap Job's psql (not an app setting, so no env prefix).
  - name: db-bootstrap-secrets
    literals:
      - ADMIN_DATABASE_URL=postgres://studio:dev-only-pg-password@postgres:5432/postgres?sslmode=disable
      - API_APP_PASSWORD=dev-only-api-app-pw
      - PIPELINE_APP_PASSWORD=dev-only-pipeline-pw
      - VERSIONING_OWNER_PASSWORD=dev-only-owner-pw
      - VERSIONING_APP_PASSWORD=dev-only-app-pw

# The service-JWT key pairs (Secrets `api-versioning-jwt` and `pipeline-versioning-jwt`,
# ConfigMaps `versioning-jwks` and `api-jwks`) aren't generated here, so no private key is ever
# committed: `pnpm k8s:dev-keys` creates them in the namespace (once; pods wait for them).

patches:
  # One replica each: drop the HPAs (Deployments without `replicas` then run one).
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: any
  - target:
      kind: Deployment
      name: versioning
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # The dev Postgres has no DBA: run db-bootstrap (api_app, pipeline_app, schema `pipeline`) on
  # apply. pipeline-migrate retries until it has finished.
  - target:
      kind: Job
      name: db-bootstrap
    patch: |-
      - op: replace
        path: /spec/suspend
        value: false
  - target:
      kind: Job
      name: pipeline-migrate
    patch: |-
      - op: replace
        path: /spec/backoffLimit
        value: 8
  # The agent runs with sandboxes off in dev: no Daytona sandboxes to sweep, and no key.
  - target:
      kind: CronJob
      name: agent-sweeper
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
  - target:
      kind: ConfigMap
      name: pipeline-config
    patch: |-
      - op: replace
        path: /data/STUDIO_ENV
        value: development
  # Worker: at most two, still scaled from zero by KEDA.
  - target:
      kind: ScaledObject
      name: worker
    patch: |-
      - op: replace
        path: /spec/maxReplicaCount
        value: 2
  - target:
      kind: ConfigMap
      name: worker-config
    patch: |-
      - op: replace
        path: /data/KEDA_REDIS_ADDRESS
        value: redis.studio-dev.svc.cluster.local:6379
  # todo13 (§7.4 "Dev"): every drop flag on; names screened by the regex screen (no Sensitive
  # Data Protection on a local cluster).
  - target:
      kind: ConfigMap
      name: api-config
    patch: |-
      - op: replace
        path: /data/STUDIO_API_FEATURE_CHAT_DROPS
        value: "true"
      - op: replace
        path: /data/STUDIO_API_FEATURE_DATASETS_TAB
        value: "true"
      - op: replace
        path: /data/STUDIO_API_FEATURE_FAST_PATH
        value: "true"
      - op: replace
        path: /data/STUDIO_API_FEATURE_AUTO_APPLY
        value: "true"
      - op: replace
        path: /data/STUDIO_API_NAME_SCREEN_MODE
        value: regex
      # Sign-in is WorkOS here too (todo22 D2; dev auth is only `pnpm dev` and infra/docker):
      # point AuthKit at the port-forwarded host and fill workos-secrets (infra/k8s/README.md).
      - op: add
        path: /data/STUDIO_API_WORKOS_REDIRECT_URI
        value: http://localhost:8080/api/auth/callback
      - op: add
        path: /data/STUDIO_API_PUBLIC_URL
        value: http://localhost:8080
  # No model or Daytona key needed: scripted model, sandboxes off (both refused in production).
  - target:
      kind: ConfigMap
      name: agent-config
    patch: |-
      - op: replace
        path: /data/STUDIO_ENV
        value: development
      - op: add
        path: /data/STUDIO_AGENT_MODEL
        value: scripted
      - op: add
        path: /data/STUDIO_AGENT_SANDBOX
        value: "off"
      # The WorkOS staging client id (placeholder; the same as in workos-secrets).
      - op: add
        path: /data/STUDIO_AGENT_WORKOS_CLIENT_ID
        value: client_00000000000000000000000000
  # The dev Postgres has no DBA: bootstrap the versioning roles and schema first.
  - target:
      kind: Job
      name: versioning-migrate
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: bootstrap
            image: studio-versioning
            command: ["/app/bin/migrate", "bootstrap"]
            envFrom:
              - secretRef:
                  name: versioning-bootstrap-secrets
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
