[project]
name = "studio-api"
version = "0.1.0"
description = "Studio kernel and plugin control plane (docs/plugins.md §6, §7, §11)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.54",
    "pydantic>=2.14",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "cryptography>=50",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "boto3>=1.35",
    "jsonpatch>=1.33",
    "studio-observability",
]

[project.optional-dependencies]
# OpenTelemetry export (on when OTEL_EXPORTER_OTLP_ENDPOINT is set): `uv sync --extra otel`.
otel = ["studio-observability[otel]"]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "datamodel-code-generator==0.87.0",
]

[tool.uv.sources]
studio-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
