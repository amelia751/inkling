<!doctype html>
<!-- The ext-apps reference host's sandbox proxy (examples/basic-host/src/sandbox.ts, MIT), inlined.
     Served on its own origin with a CSP header by run.mjs. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%}</style></head><body><script>
const ALLOWED_REFERRER_PATTERN = /^http:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/;
if (window.self === window.top) throw new Error("This file is only to be used in an iframe sandbox.");
if (!document.referrer || !ALLOWED_REFERRER_PATTERN.test(document.referrer)) throw new Error("Embedding domain not allowed");
const EXPECTED_HOST_ORIGIN = new URL(document.referrer).origin;
const OWN_ORIGIN = new URL(window.location.href).origin;
try { window.top.alert("If you see this, the sandbox is not setup securely."); throw "FAIL"; } catch (e) { if (e === "FAIL") throw new Error("The sandbox is not setup securely."); }
const inner = document.createElement("iframe");
inner.style = "width:100%; height:100%; border:none;";
inner.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms");
document.body.appendChild(inner);
window.addEventListener("message", (event) => {
  if (event.source === window.parent) {
    if (event.origin !== EXPECTED_HOST_ORIGIN) return;
    if (event.data && event.data.method === "ui/notifications/sandbox-resource-ready") {
      const { html, sandbox } = event.data.params;
      if (typeof sandbox === "string") inner.setAttribute("sandbox", sandbox);
      if (typeof html === "string") { const doc = inner.contentDocument || inner.contentWindow?.document; if (doc) { doc.open(); doc.write(html); doc.close(); } else inner.srcdoc = html; }
    } else if (inner && inner.contentWindow) inner.contentWindow.postMessage(event.data, "*");
  } else if (event.source === inner.contentWindow) {
    if (event.origin !== OWN_ORIGIN) return;
    window.parent.postMessage(event.data, EXPECTED_HOST_ORIGIN);
  }
});
window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/sandbox-proxy-ready", params: {} }, EXPECTED_HOST_ORIGIN);
</script></body></html>
