# Sign-in with WorkOS (todo9 Phase 14; on by default since todo22 D2). Base already sets
# STUDIO_API_AUTH_MODE=workos, STUDIO_API_DEV_TRUST_HEADERS=0 and STUDIO_WEB_AUTH_MODE=workos;
# this component adds what is specific to gke/phi (infra/k8s/README.md, "WorkOS runbook"):
#   - ConfigMap api-auth-config, after api-config in the api's envFrom: the redirect URI and
#     public URL (host from STUDIO_HOST, values/);
#   - NetworkPolicy workos-egress: api may open 443 to public addresses (network.yaml).
# Before the first apply: the WorkOS environment is seeded (infra/workos/seed.yml) with redirect
# URI exactly https://<STUDIO_HOST>/api/auth/callback, and Secret Manager secret workos-secrets has
# a version (key, Fernet cookie password, client id) that its ExternalSecret reports SecretSynced.
# The ingress IP allow-list (STUDIO_ALLOW_CIDRS, patches/) stays until a sign-in is verified on
# the live host; then remove it.
# The agent (spurby-ai, ../../ai) reads STUDIO_AGENT_WORKOS_CLIENT_ID from its gke-values.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - configmap.yaml
  - network.yaml
patches:
  # After api-config (index 0), so its keys override the base defaults; the Secrets stay after it.
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/1
        value:
          configMapRef:
            name: api-auth-config
