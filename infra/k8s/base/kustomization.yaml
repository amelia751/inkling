# Every app, the Ingress and the Jobs. Environment specifics (replicas, images, endpoints,
# NetworkPolicies, in-cluster deps) live in overlays/. Secrets are never here: each app
# reads `<app>-secrets` (infra/k8s/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: studio
    includeSelectors: false
    includeTemplates: true
resources:
  - web
  - api
  - agent
  - worker
  - versioning
  - jobs
  - ingress.yaml
