[project]
name = "studio-plugin-finance"
version = "0.1.0"
description = "Finance fixture generators: ledgers and prices with planted truth (todo23 W8)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["pytest>=9.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_plugin_finance"]

[tool.pytest.ini_options]
pythonpath = ["src"]
