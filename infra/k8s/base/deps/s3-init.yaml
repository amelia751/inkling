# Creates the buckets (idempotent): `assets` for apps/api and apps/versioning's
# <resourcePrefix>-objects / <resourcePrefix>-manifests.
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-init
  labels:
    app.kubernetes.io/name: s3-init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: amazon/aws-cli:2.31.13
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for b in $BUCKETS; do
                aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$b" 2>/dev/null \
                  || aws --endpoint-url http://s3:9000 s3api create-bucket --bucket "$b"
                echo "bucket $b ready"
              done
          env:
            - name: BUCKETS
              value: assets studio-objects studio-manifests
            - name: HOME
              value: /tmp
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: when_required
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: when_required
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: deps-secrets
                  key: S3_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: deps-secrets
                  key: S3_SECRET_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
