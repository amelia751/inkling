# Browser e2e tests (Playwright). A uv workspace member so `uv run --package studio-web-e2e
# python apps/web/e2e/<name>_test.py --port 5199` uses the locked environment.
[project]
name = "studio-web-e2e"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["playwright>=1.55", "numpy>=2.3", "pillow>=11.3", "pydicom>=3.0"]

[tool.uv]
package = false
