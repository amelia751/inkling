[project]
name = "studio-plugin-segmentation"
version = "1.0.0"
description = "Reference image.segment plugin"
requires-python = ">=3.12"
dependencies = ["studio-plugin-sdk", "httpx>=0.28"]

[dependency-groups]
dev = ["pytest>=9.2", "pyyaml>=6.0", "jsonschema>=4.23"]

[tool.uv.sources]
studio-plugin-sdk = { path = "../../packages/plugin-sdk" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_plugin_segmentation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
