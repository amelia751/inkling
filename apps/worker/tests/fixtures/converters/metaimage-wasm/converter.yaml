# The same converter as metaimage-py, as a WASI command module (todo10 D3 trial). metaimage.wasm
# is built from metaimage.c with a pinned toolchain (ziglang 0.17.0:
# `python -m ziglang cc --target=wasm32-wasi -O2 -s metaimage.c -o metaimage.wasm`); the test
# rebuilds it when ziglang is installed. In production the worker's build_plugin job rebuilds it.
id: inkling.metaimage-to-nifti-wasm
version: 0.1.0
title: MetaImage to NIfTI (WebAssembly)
description: "Reads 2D/3D MetaImage (.mha) volumes with inline uncompressed data and writes NIfTI-1 (.nii)."
accepts:
  ext: [".mha"]
  headerContains: ["ObjectType", "ElementType"]
produces: assets
output:
  mediaType: application/x-nifti
  ext: .nii
  dataKind: inkling.volume.dataKinds.volume
  preset: preset:volume-3d
runtime:
  kind: wasm
  module: metaimage.wasm
  abi: wasi-p1
  fuelMillions: 2000
limits:
  timeoutS: 60
  memoryMb: 512
